report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/rnastructurome/tree/dev" target="_blank">nf-core/rnastructurome</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/rnastructurome/dev/docs/output" target="_blank">documentation</a>.

# ── Section order follows the intended report reading order ───────────────────
# MultiQC places higher values earlier, so keep this block in top-to-bottom
# display order.
report_section_order:
  # 1. Read-count progression & RF-count coverage
  "nf-core-rnastructurome-count-progression":
    order: 1700
  # 2. RF-norm statistics (per normalisation group)
  "nf-core-rnastructurome-rfnorm-stats":
    order: 1600
  # 3. RF-fold statistics (per fold group)
  "nf-core-rnastructurome-rffold-stats":
    order: 1500
  # 3b. RF-eval agreement with reference structures (only when --rfeval_reference is set)
  "nf-core-rnastructurome-rfeval":
    order: 1450
  # 4. Raw read QC (FastQC pre-trim)
  fastqc_sequence_counts_plot:
    order: 1400
  fastqc_per_base_sequence_quality_plot:
    order: 1399
  fastqc_per_sequence_quality_scores_plot:
    order: 1398
  fastqc_per_sequence_gc_content_plot:
    order: 1397
  fastqc_per_base_n_content_plot:
    order: 1396
  fastqc_sequence_length_distribution_plot:
    order: 1395
  fastqc_sequence_duplication_levels_plot:
    order: 1394
  fastqc_overrepresented_sequences_plot:
    order: 1393
  fastqc_top_overrepresented_sequences_table:
    order: 1392
  fastqc-status-check-heatmap:
    order: 1391
  # 5. Adapter & quality trimming (Cutadapt)
  cutadapt_filtered_reads_plot:
    order: 1300
  cutadapt_trimmed_sequences_plot_5:
    order: 1299
  cutadapt_trimmed_sequences_plot_3:
    order: 1298
  "nf-core-rnastructurome-cutadapt-adapters":
    order: 1297
  # 6. Alignment (Bowtie / Bowtie2)
  bowtie1_alignment:
    order: 1200
  # 7. Post-alignment statistics (Samtools)
  samtools_alignment_plot:
    order: 1100
  samtools-flagstat-table:
    order: 1099
  samtools-flagstat-pct-table:
    order: 1098
  samtools-idxstats-mapped-reads-plot:
    order: 1097
  samtools-stats-dp:
    order: 1096
  # ── Footer ───────────────────────────────────────────────────────────────────
  "nf-core-rnastructurome-summary":
    order: -1001
  software_versions:
    order: -1000
  "nf-core-rnastructurome-methods-description":
    order: -999

# ── General Statistics table: one non-redundant column per pipeline step ──────
# The Count Progression table (below General Stats) already shows the full
# read-count journey (pre-dedup → post-dedup → covered transcripts), so
# Samtools Stats and Samtools Flagstat columns are hidden here to avoid
# duplication.  Bowtie alignment rate represents the alignment step.
table_columns_visible:
  FastQC:
    total_sequences: false # covered by count progression table
    percent_gc: true
    percent_duplicates: true
    avg_sequence_length: false
    median_sequence_length: false
    percent_fails: false
  Cutadapt:
    percent_trimmed: true
    r_with_adapters: false
    r_too_short: false
  "Bowtie 1":
    reads_aligned_percentage: true # actual alignment rate — more informative than Samtools % mapped
    reads_aligned: false
    non_primary_alignments: false
  "Bowtie 2 / HiSAT2":
    overall_alignment_rate: true # column key differs from Bowtie 1
    reads_aligned: false
    non_primary_alignments: false
  # samtools submodule namespaces are "<ModuleName>: <submodule>" (colon+space, case-insensitive)
  "Samtools: stats":
    error_rate: false
    non_primary_alignments: false
    reads_mapped: false
    reads_mapped_percent: false
    raw_total_sequences: false
    insert_size_average: false
    reads_properly_paired_percent: false
    reads_MQ0_percent: false
  "Samtools: flagstat":
    flagstat_total: false
    mapped_passed: false
    mapped_passed_pct: false
  # UMI-tools: hide dedup unique-read count and extract rate (covered by count progression table)
  "UMI-tools":
    dedup_output_reads: false
    extract_percent_passing: false

# Column placement sets left-to-right order in the General Statistics table,
# mirroring pipeline execution: raw reads → quality → trimming → alignment.
table_columns_placement:
  FastQC:
    total_sequences: 100
    percent_duplicates: 110
    percent_gc: 120
  Cutadapt:
    percent_trimmed: 200
  "Bowtie 1":
    reads_aligned_percentage: 300
  "Bowtie 2 / HiSAT2":
    overall_alignment_rate: 310

export_plots: true

disable_version_detection: true
