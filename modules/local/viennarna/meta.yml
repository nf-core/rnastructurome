name: viennarna
description: Draw RNA secondary structure diagrams using ViennaRNA RNAplot and
  colour nucleotides by SHAPE/DMS reactivity for transcripts without an R2DT
  template
keywords:
  - viennarna
  - rna
  - secondary structure
  - svg
  - reactivity
  - shape
  - dms
tools:
  - viennarna:
      description: The ViennaRNA Package provides tools for RNA secondary
        structure prediction and comparison
      homepage: https://www.tbi.univie.ac.at/RNA/
      documentation: https://www.tbi.univie.ac.at/RNA/documentation.html
      licence:
        - "AFL-2.1"
      identifier: biotools:viennarna
  - python:
      description: Python runtime used to extract reactivities from XML and colour
        SVG output
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence:
        - "Python-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing group metadata (e.g. sample_group,
          condition)
    - fold_dir:
        type: directory
        description: Directory of RNAFramework rf-fold output files (dot-bracket
          structures)
    - xml:
        type: file
        description: RNAFramework XML reactivity files (one per replicate)
        pattern: "*.xml"
        ontologies:
          - edam: http://edamontology.org/format_2332
    - drawn_ids:
        type: file
        description: Text file listing transcript IDs already drawn by R2DT (to
          avoid duplication)
        pattern: "r2dt_drawn_ids.txt"
        ontologies: []
output:
  plots:
    - - meta:
          type: map
          description: Groovy Map containing group metadata
      - "${prefix}_structures/*.svg":
          type: file
          description: Reactivity-coloured SVG structure diagrams (absent if no
            structures were drawn)
          pattern: "*.svg"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
