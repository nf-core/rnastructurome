name: merge_wig
description: Merge per-transcript WIG reactivity files into a single combined WIG file
keywords:
  - wig
  - merge
  - reactivity
  - rnaframework
tools:
  - bash:
      description: Bash shell used to concatenate per-transcript WIG files
      homepage: https://www.gnu.org/software/bash/
      documentation: https://www.gnu.org/software/bash/manual/
      licence: ["GPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata (e.g. id, condition, replicate)
    - wig:
        type: file
        description: One or more per-transcript WIG reactivity files
        pattern: "*.wig"
output:
  merged_wig:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*.merged.wig":
          type: file
          description: Combined WIG file for downstream genomic remapping
          pattern: "*.merged.wig"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
