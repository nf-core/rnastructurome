name: ensembl_transcriptome
description: Download and merge Ensembl transcript FASTA files for a species
keywords:
  - ensembl
  - transcriptome
  - fasta
  - cdna
  - ncrna
tools:
  - ensembl:
      description: |
        Ensembl provides genome-scale reference annotation resources, including transcript FASTA files.
      homepage: https://www.ensembl.org
      documentation: https://www.ensembl.org/info/data/ftp/index.html
      licence: ["Apache-2.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing reference metadata
          e.g. [ id:'homo_sapiens', organism:'Homo sapiens' ]
    - ensembl_species:
        type: string
        description: |
          Ensembl species name or Latin binomial to resolve against the Ensembl FASTA tree.

output:
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference metadata
            e.g. [ id:'homo_sapiens', organism:'homo_sapiens' ]
      - "*.transcripts.fa.gz":
          type: file
          description: Merged transcript FASTA containing cdna and optional ncrna entries
          pattern: "*.transcripts.fa.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1929" # FASTA
            - edam: "http://edamontology.org/format_3989" # GZIP
  source_urls:
    - "ensembl_source_url.txt":
        type: file
        description: Text file listing Ensembl source FASTA URLs used to build the merged transcript FASTA
        pattern: "ensembl_source_url.txt"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Textual format
  warnings:
    - "ensembl_warnings.log":
        type: file
        description: Optional warning log emitted when optional ncrna FASTA is not available for the species
        pattern: "ensembl_warnings.log"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Textual format
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []

authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
