name: "ensembl_genome"
description: Download a species genome FASTA from Ensembl using a helper Python script
keywords:
  - ensembl
  - genome
  - download
  - fasta
  - reference
tools:
  - "ensembl":
      description: "Downloads a species genome FASTA from the Ensembl FTP/REST endpoints via a bundled Python helper script."
      homepage: "https://www.ensembl.org"
      documentation: "https://www.ensembl.org/info/data/ftp/index.html"
      licence: ["Apache-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - ensembl_species:
        type: string
        description: Ensembl species name (e.g. `homo_sapiens`)
  - - ensembl_config_input:
        type: map
        description: |
          Optional Groovy Map overriding the default Ensembl configuration
          (e.g. `ensembl_release`, `ensembl_base_url`)
output:
  - fasta:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${meta.id}.genome.fa":
          type: file
          description: Downloaded genome FASTA (absent if the species was not found)
          pattern: "*.genome.fa"
  - source_url:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "ensembl_source_url.txt":
          type: file
          description: Text file recording the Ensembl source URL the genome was downloaded from
          pattern: "ensembl_source_url.txt"
  - not_found:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "${meta.id}.not_found":
          type: file
          description: Marker file emitted when the requested species genome could not be found
          pattern: "*.not_found"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
