name: merge_bp
description: Merge per-transcript base-pair arc files into a single genomic BP file
keywords:
  - bp
  - arc
  - rnaframework
  - secondary structure
tools:
  - python:
      description: Python runtime used for BP file merging
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["Python-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing group metadata (e.g. sample_group, condition)
    - bp_files:
        type: file
        description: One or more per-transcript BP arc files
        pattern: "*.bp"
output:
  bp:
    - - meta:
          type: map
          description: Groovy Map containing group metadata
      - "${meta.id}.bp":
          type: file
          description: Merged BP arc file (absent if no arcs were present)
          pattern: "*.bp"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
